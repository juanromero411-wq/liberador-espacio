<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liberador de espacio</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #050b1a; color: #fff; font-family: system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 120px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: #374c79; margin: 0 0 18px; font-size: 14px; }
  .barra { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .ruta-box { flex: 1; min-width: 220px; background: #12224a; color: #cfe0ff;
              border: 1px solid #1d3a7a; border-radius: 10px; padding: 10px 12px;
              font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { background: #1f7bff; color: #fff; border: 0; border-radius: 10px;
           padding: 10px 16px; font-size: 15px; cursor: pointer; }
  button.sec { background: #12224a; border: 1px solid #1d3a7a; color: #cfe0ff; }
  button.peligro { background: #d63b4d; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #estado { color: #8fa6d6; margin: 14px 0; min-height: 22px; }
  .cuar { background: #12224a; border: 1px solid #1d3a7a; border-radius: 12px; padding: 10px 12px;
          margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
          gap: 8px; flex-wrap: wrap; font-size: 14px; }
  .grupo { background: #0a1430; border: 1px solid #1d3a7a; border-radius: 14px;
           padding: 12px; margin-bottom: 12px; }
  .gt { color: #4da3ff; margin-bottom: 6px; font-weight: 600; }
  label { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; font-size: 14px;
          word-break: break-all; }
  #acciones { position: fixed; left: 0; right: 0; bottom: 0; background: #060d20;
              border-top: 1px solid #1d3a7a; padding: 12px 16px; display: flex; gap: 10px;
              align-items: center; flex-wrap: wrap; justify-content: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Liberador de espacio</h1>
  <p class="sub">Encuentra archivos duplicados y libera espacio de forma segura.</p>

  <div class="barra">
    <button class="sec" id="btnElegir">Elegir carpeta o disco</button>
    <div class="ruta-box" id="rutaElegida">Ninguna carpeta seleccionada</div>
    <button id="btnEscanear" disabled>Escanear</button>
  </div>

  <p id="estado"></p>
  <div id="cuarentenas"></div>
  <div id="resultado"></div>
</main>

<div id="acciones" hidden>
  <button class="sec" id="btnAuto">Seleccionar copias automáticamente</button>
  <span id="seleccion"></span>
  <button class="peligro" id="btnMover">Mover a cuarentena</button>
</div>

<script>
  let rootHandle = null;
  let grupos = [];
  let registroArchivos = new Map(); // ruta -> { fileHandle, parentHandle, name }
  let config = { cuarentena: "_CUARENTENA", protegidas: [] };

  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function fmt(b) {
    const u = ["B", "KB", "MB", "GB", "TB"];
    let i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return b.toFixed(i ? 1 : 0) + " " + u[i];
  }

  async function api(url, datos) {
    const opciones = datos
      ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(datos) }
      : undefined;
    const r = await fetch(url, opciones);
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || "Error en el servidor");
    return j;
  }

  async function calcularHashSHA256(file) {
    const buffer = await file.arrayBuffer();
    const hashBuffer = await crypto.subtle.digest("SHA-256", buffer);
    return Array.from(new Uint8Array(hashBuffer))
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");
  }

  async function tamanoDirectorio(dirHandle) {
    let total = 0;
    for await (const entry of dirHandle.values()) {
      if (entry.kind === "file") {
        try {
          const f = await entry.getFile();
          total += f.size;
        } catch {}
      } else if (entry.kind === "directory") {
        total += await tamanoDirectorio(entry);
      }
    }
    return total;
  }

  async function revisarCuarentena() {
    if (!rootHandle) return;
    try {
      const cuarHandle = await rootHandle.getDirectoryHandle(config.cuarentena);
      const tamano = await tamanoDirectorio(cuarHandle);
      if (tamano > 0) {
        $("cuarentenas").innerHTML = `
          <div class="cuar">
            <span>Cuarentena en ${esc(rootHandle.name)}: ${fmt(tamano)} (aún no liberan espacio)</span>
            <button class="peligro" id="btnVaciar">Vaciar definitivamente</button>
          </div>`;
        $("btnVaciar").onclick = vaciarCuarentena;
        return;
      }
    } catch {}
    $("cuarentenas").innerHTML = "";
  }

  async function vaciarCuarentena() {
    if (!rootHandle) return;
    if (!confirm(`Esto elimina PARA SIEMPRE los archivos de la cuarentena de ${rootHandle.name}. ¿Continuar?`)) return;
    try {
      const cuarHandle = await rootHandle.getDirectoryHandle(config.cuarentena);
      const liberado = await tamanoDirectorio(cuarHandle);
      await rootHandle.removeEntry(config.cuarentena, { recursive: true });
      $("estado").textContent = "Espacio liberado: " + fmt(liberado);
      await revisarCuarentena();
    } catch (e) {
      alert("No se pudo vaciar la cuarentena: " + e.message);
    }
  }

  function dibujar() {
    $("resultado").innerHTML = grupos.map((g, i) => `
      <div class="grupo">
        <div class="gt">Grupo ${i + 1}: ${g.rutas.length} archivos de ${fmt(g.tamano)}</div>
        ${g.rutas.map((r, k) => `
          <label><input type="checkbox" data-g="${i}" data-k="${k}"> ${esc(r)}</label>`).join("")}
      </div>`).join("");
    $("acciones").hidden = !grupos.length;
    actualizarSeleccion();
  }

  function marcadas() {
    return [...document.querySelectorAll("#resultado input:checked")];
  }

  function actualizarSeleccion() {
    const m = marcadas();
    const total = m.reduce((s, x) => s + grupos[x.dataset.g].tamano, 0);
    $("seleccion").textContent = m.length ? `${m.length} archivos · ${fmt(total)}` : "Nada seleccionado";
  }

  $("resultado").addEventListener("change", actualizarSeleccion);

  $("btnAuto").onclick = () => {
    document.querySelectorAll("#resultado input").forEach(x => { x.checked = x.dataset.k !== "0"; });
    actualizarSeleccion();
  };

  $("btnElegir").onclick = async () => {
    if (!window.showDirectoryPicker) {
      $("estado").textContent = "Tu navegador no soporta acceso a carpetas locales. Usa Chrome, Edge o Brave en escritorio.";
      return;
    }
    try {
      rootHandle = await window.showDirectoryPicker({ mode: "readwrite" });
      $("rutaElegida").textContent = rootHandle.name;
      $("btnEscanear").disabled = false;
      grupos = [];
      dibujar();
      $("estado").textContent = `Carpeta "${rootHandle.name}" lista para escanear.`;
      await revisarCuarentena();
    } catch (e) {
      if (e.name !== "AbortError") {
        $("estado").textContent = "No se pudo abrir la carpeta: " + e.message;
      }
    }
  };

  $("btnEscanear").onclick = async () => {
    if (!rootHandle) return;
    $("btnEscanear").disabled = true;
    $("btnElegir").disabled = true;
    registroArchivos.clear();
    const protegidasSet = new Set(config.protegidas.map(x => x.toLowerCase()));
    const porTamano = new Map();
    let explorados = 0;

    try {
      $("estado").textContent = "Analizando tamaños de archivos...";

      async function recorrer(dirHandle, prefijo) {
        for await (const entry of dirHandle.values()) {
          if (entry.kind === "directory") {
            if (protegidasSet.has(entry.name.toLowerCase())) continue;
            await recorrer(entry, `${prefijo}/${entry.name}`);
          } else if (entry.kind === "file") {
            try {
              const file = await entry.getFile();
              explorados++;
              if (explorados % 200 === 0) {
                $("estado").textContent = `Analizando tamaños... (${explorados} archivos revisados)`;
              }
              if (file.size <= 0) continue;
              const ruta = `${prefijo}/${entry.name}`;
              registroArchivos.set(ruta, { fileHandle: entry, parentHandle: dirHandle, name: entry.name });
              if (!porTamano.has(file.size)) porTamano.set(file.size, []);
              porTamano.get(file.size).push({ ruta, file });
            } catch {}
          }
        }
      }

      await recorrer(rootHandle, rootHandle.name);

      // Solo calcula SHA-256 de archivos que comparten exactamente el mismo tamaño
      const candidatos = [];
      for (const lista of porTamano.values()) {
        if (lista.length > 1) candidatos.push(...lista);
      }

      const metadatos = [];
      for (let i = 0; i < candidatos.length; i++) {
        if (i % 10 === 0) {
          $("estado").textContent = `Calculando huellas SHA-256 (${i + 1} de ${candidatos.length} candidatos)...`;
        }
        try {
          const hash = await calcularHashSHA256(candidatos[i].file);
          metadatos.push({
            ruta: candidatos[i].ruta,
            tamano: candidatos[i].file.size,
            hash
          });
        } catch {}
      }

      $("estado").textContent = "Agrupando duplicados en el servidor...";
      const r = await api("/api/escanear", { carpeta: rootHandle.name, archivos: metadatos });
      grupos = r.grupos;
      dibujar();
      $("estado").textContent = grupos.length
        ? `${grupos.length} grupos de duplicados · espacio recuperable: ${fmt(r.recuperable)}`
        : "No se encontraron duplicados.";
    } catch (e) {
      $("estado").textContent = e.message;
    }

    $("btnEscanear").disabled = false;
    $("btnElegir").disabled = false;
  };

  $("btnMover").onclick = async () => {
    const elegidas = marcadas().map(x => grupos[x.dataset.g].rutas[x.dataset.k]);
    if (!elegidas.length) { alert("No has seleccionado archivos."); return; }
    if (!confirm(`Se moverán ${elegidas.length} archivos a la carpeta de cuarentena. Podrás recuperarlos hasta que la vacíes. ¿Continuar?`)) return;

    $("btnMover").disabled = true;
    try {
      const permiso = await api("/api/validar-cuarentena", { grupos, elegidas });
      const cuarDir = await rootHandle.getDirectoryHandle(permiso.cuarentena, { create: true });
      const loteDir = await cuarDir.getDirectoryHandle(permiso.lote, { create: true });

      const movidas = new Set();
      let tamanoTotal = 0;
      let errores = 0;

      for (const ruta of elegidas) {
        const info = registroArchivos.get(ruta);
        if (!info) { errores++; continue; }
        try {
          const srcFile = await info.fileHandle.getFile();
          // Recrea la estructura de subcarpetas dentro de _CUARENTENA/<lote>
          const partes = ruta.split("/").slice(1, -1);
          let destinoDir = loteDir;
          for (const carpeta of partes) {
            destinoDir = await destinoDir.getDirectoryHandle(carpeta, { create: true });
          }
          const destFile = await destinoDir.getFileHandle(info.name, { create: true });
          const writable = await destFile.createWritable();
          await srcFile.stream().pipeTo(writable);
          await info.parentHandle.removeEntry(info.name);

          movidas.add(ruta);
          tamanoTotal += srcFile.size;
          registroArchivos.delete(ruta);
        } catch {
          errores++;
        }
      }

      $("estado").textContent = `Movidos ${movidas.size} archivos (${fmt(tamanoTotal)}) a cuarentena` +
        (errores ? ` · ${errores} con error` : "");

      grupos = grupos
        .map(g => ({ tamano: g.tamano, rutas: g.rutas.filter(x => !movidas.has(x)) }))
        .filter(g => g.rutas.length > 1);
      dibujar();
      await revisarCuarentena();
    } catch (e) {
      alert(e.message);
    }
    $("btnMover").disabled = false;
  };

  api("/api/config").then(c => { config = c; }).catch(() => {});
</script>
</body>
</html>
